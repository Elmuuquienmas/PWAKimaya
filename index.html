<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Kimaya: El Bosque del Eco. Plataformas 2D para PC con tu celular como control." />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Kimaya Companion</title>
    <script>
      // En Android, prompt() tiene que llamarse en el mismo toque, sin esperar a React.
      window.__kimayaPrompt = null
      window.__kimayaInstalled = false
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault()
        window.__kimayaPrompt = event
        window.dispatchEvent(new Event('kimaya-install'))
      })
      window.addEventListener('appinstalled', function () {
        window.__kimayaPrompt = null
        window.__kimayaInstalled = true
        window.dispatchEvent(new Event('kimaya-install'))
      })
      document.addEventListener('click', function (event) {
        var button = event.target.closest && event.target.closest('[data-install]')
        var promptEvent = window.__kimayaPrompt
        if (!button || !promptEvent) return
        event.stopPropagation()
        window.__kimayaPrompt = null
        promptEvent.prompt()
        promptEvent.userChoice.then(function (choice) {
          if (choice.outcome === 'accepted') window.__kimayaInstalled = true
          window.dispatchEvent(new Event('kimaya-install'))
        })
      }, true)
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
