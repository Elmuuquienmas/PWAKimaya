<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Kimaya: El Bosque del Eco. Plataformas 2D para PC con tu celular como control." />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Kimaya Companion</title>
    <script>
      // Se guarda el aviso de Chrome antes de que cargue React, si no el boton llega tarde.
      window.__kimayaPrompt = null
      window.__kimayaInstalled = false
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault()
        window.__kimayaPrompt = event
        window.dispatchEvent(new Event('kimaya-install'))
      })
      window.addEventListener('appinstalled', function () {
        window.__kimayaPrompt = null
        window.__kimayaInstalled = true
        window.dispatchEvent(new Event('kimaya-install'))
      })
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (sessionStorage.getItem('kimaya-sw-ready')) return
          sessionStorage.setItem('kimaya-sw-ready', '1')
          location.reload()
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
