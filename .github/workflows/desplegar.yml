name: Publicar en Cloudflare

# Cada push a main construye la PWA y la sube al proyecto kimaya-companion.
# También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-cloudflare
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir la PWA
        run: npm run build

      - name: Subir a Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name kimaya-companion --branch main --commit-dirty=true
